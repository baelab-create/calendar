<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Calendar</title>

  <!-- Google API Client & Identity Services -->
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --today: #fef3c7;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .month-label {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    button.secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .status {
      padding: 16px;
      background: var(--accent-soft);
      border-radius: 8px;
      color: var(--accent);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .status.error {
      background: #fef2f2;
      color: #dc2626;
    }

    .events-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .event {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      align-items: start;
    }

    .event:last-child { border-bottom: none; }

    .event.today {
      background: var(--today);
    }

    .event-date {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .event-date .day-num {
      display: block;
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.1;
    }

    .event.today .event-date .day-num {
      color: var(--accent);
    }

    .event-body {
      min-width: 0;
    }

    .event-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
      word-wrap: break-word;
    }

    .event-time {
      font-size: 13px;
      color: var(--text-muted);
    }

    .event-location {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .empty {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 24px;
      text-align: center;
    }

    .login-card h2 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .login-card p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>My Calendar</h1>
        <div class="month-label" id="monthLabel"></div>
      </div>
      <div id="auth-buttons">
        <button id="signoutBtn" class="secondary" style="display:none;">로그아웃</button>
      </div>
    </header>

    <div id="status" class="status" style="display:none;"></div>

    <div id="login-area" class="login-card">
      <h2>Google 캘린더에 로그인하세요</h2>
      <p>이번 달 일정을 불러옵니다.</p>
      <button id="signinBtn" disabled>준비 중...</button>
    </div>

    <div id="events-area" style="display:none;">
      <div id="events-list" class="events-list"></div>
    </div>

    <div class="footer">
      Google Calendar API · GitHub Pages
    </div>
  </div>

  <script>
    // ===== 설정 =====
    const CLIENT_ID = '147776399744-59t4vlsuhb7fqgkshi5vc2m00t6g5m2g.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';
    const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';

    // ===== 상태 =====
    let tokenClient;
    let gapiInited = false;
    let gisInited = false;

    // ===== UI 헬퍼 =====
    function showStatus(msg, isError) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status' + (isError ? ' error' : '');
      el.style.display = 'block';
    }
    function hideStatus() {
      document.getElementById('status').style.display = 'none';
    }

    // ===== 초기화 =====
    function gapiLoaded() {
      gapi.load('client', initializeGapiClient);
    }
    async function initializeGapiClient() {
      await gapi.client.init({ discoveryDocs: [DISCOVERY_DOC] });
      gapiInited = true;
      maybeEnableButtons();
    }
    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: '', // 동적으로 할당
      });
      gisInited = true;
      maybeEnableButtons();
    }
    function maybeEnableButtons() {
      if (gapiInited && gisInited) {
        const btn = document.getElementById('signinBtn');
        btn.disabled = false;
        btn.textContent = 'Google로 로그인';
      }
    }

    // ===== 로그인 / 로그아웃 =====
    document.getElementById('signinBtn').addEventListener('click', () => {
      tokenClient.callback = async (resp) => {
        if (resp.error !== undefined) {
          showStatus('로그인 실패: ' + resp.error, true);
          return;
        }
        document.getElementById('login-area').style.display = 'none';
        document.getElementById('events-area').style.display = 'block';
        document.getElementById('signoutBtn').style.display = 'inline-block';
        await loadEvents();
      };
      if (gapi.client.getToken() === null) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        tokenClient.requestAccessToken({ prompt: '' });
      }
    });

    document.getElementById('signoutBtn').addEventListener('click', () => {
      const token = gapi.client.getToken();
      if (token !== null) {
        google.accounts.oauth2.revoke(token.access_token, () => {});
        gapi.client.setToken('');
      }
      document.getElementById('login-area').style.display = 'block';
      document.getElementById('events-area').style.display = 'none';
      document.getElementById('signoutBtn').style.display = 'none';
      document.getElementById('events-list').innerHTML = '';
      hideStatus();
    });

    // ===== 일정 로드 =====
    async function loadEvents() {
      hideStatus();
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth(); // 0-indexed

      // 이번 달 첫째 날 / 다음 달 첫째 날 (시간 = 00:00:00 로컬)
      const timeMin = new Date(year, month, 1).toISOString();
      const timeMax = new Date(year, month + 1, 1).toISOString();

      // 헤더에 월 표시
      document.getElementById('monthLabel').textContent =
        year + '년 ' + (month + 1) + '월';

      let events;
      try {
        const response = await gapi.client.calendar.events.list({
          calendarId: 'primary',
          timeMin: timeMin,
          timeMax: timeMax,
          showDeleted: false,
          singleEvents: true,
          orderBy: 'startTime',
          maxResults: 250,
        });
        events = response.result.items || [];
      } catch (err) {
        showStatus('일정을 불러오지 못했습니다: ' + (err.message || err.result?.error?.message || '알 수 없는 오류'), true);
        return;
      }

      renderEvents(events);
    }

    // ===== 렌더링 =====
    function renderEvents(events) {
      const listEl = document.getElementById('events-list');
      listEl.innerHTML = '';

      if (events.length === 0) {
        listEl.innerHTML = '<div class="empty">이번 달에 등록된 일정이 없습니다.</div>';
        return;
      }

      const today = new Date();
      const todayKey = today.getFullYear() + '-' + (today.getMonth()+1) + '-' + today.getDate();

      const weekdayKo = ['일', '월', '화', '수', '목', '금', '토'];

      events.forEach((ev) => {
        // start.dateTime 또는 start.date (종일 일정)
        const start = ev.start.dateTime || ev.start.date;
        const end = ev.end.dateTime || ev.end.date;
        const isAllDay = !ev.start.dateTime;

        const startDate = new Date(start);
        const dayKey = startDate.getFullYear() + '-' + (startDate.getMonth()+1) + '-' + startDate.getDate();
        const isToday = (dayKey === todayKey);

        const row = document.createElement('div');
        row.className = 'event' + (isToday ? ' today' : '');

        const dayNum = startDate.getDate();
        const wd = weekdayKo[startDate.getDay()];

        const dateBox = document.createElement('div');
        dateBox.className = 'event-date';
        dateBox.innerHTML = '<span class="day-num">' + dayNum + '</span>' + wd + '요일';

        const body = document.createElement('div');
        body.className = 'event-body';

        const title = document.createElement('div');
        title.className = 'event-title';
        title.textContent = ev.summary || '(제목 없음)';
        body.appendChild(title);

        const time = document.createElement('div');
        time.className = 'event-time';
        if (isAllDay) {
          time.textContent = '종일';
        } else {
          const sh = String(startDate.getHours()).padStart(2, '0');
          const sm = String(startDate.getMinutes()).padStart(2, '0');
          const endDate = new Date(end);
          const eh = String(endDate.getHours()).padStart(2, '0');
          const em = String(endDate.getMinutes()).padStart(2, '0');
          time.textContent = sh + ':' + sm + ' – ' + eh + ':' + em;
        }
        body.appendChild(time);

        if (ev.location) {
          const loc = document.createElement('div');
          loc.className = 'event-location';
          loc.textContent = '📍 ' + ev.location;
          body.appendChild(loc);
        }

        row.appendChild(dateBox);
        row.appendChild(body);
        listEl.appendChild(row);
      });
    }

    // ===== 라이브러리 로드 후 시작 =====
    window.addEventListener('load', () => {
      const checkLibs = setInterval(() => {
        if (typeof gapi !== 'undefined' && typeof google !== 'undefined' && google.accounts) {
          clearInterval(checkLibs);
          gapiLoaded();
          gisLoaded();
        }
      }, 100);
    });
  </script>
</body>
</html>
