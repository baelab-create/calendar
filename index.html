<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Calendar</title>

  <!-- Google API Client & Identity Services -->
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --today: #fef3c7;
      --saturday: #fef2f7;
      --sunday: #fce4ec;
      --saturday-num: #ec4899;
      --sunday-num: #be185d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .month-label {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    button.secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .month-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .month-toggle button {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
    }

    .month-toggle button.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .status {
      padding: 16px;
      background: var(--accent-soft);
      border-radius: 8px;
      color: var(--accent);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .status.error {
      background: #fef2f2;
      color: #dc2626;
    }

    .week-section {
      margin-bottom: 14px;
    }

    .week-header {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
      padding-left: 4px;
    }

    .week-events {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .event {
      display: grid;
      grid-template-columns: 56px 90px 1fr;
      gap: 12px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      font-size: 13px;
      min-height: 38px;
    }

    .event:last-child { border-bottom: none; }

    .event.today {
      background: var(--today);
    }

    .event.saturday {
      background: var(--saturday);
    }

    .event.sunday {
      background: var(--sunday);
    }

    /* 오늘이면서 토/일요일인 경우 — 오늘 색이 우선 */
    .event.today.saturday,
    .event.today.sunday {
      background: var(--today);
    }

    .event-date {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
    }

    .event-date .day-num {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-right: 4px;
    }

    .event.today .event-date .day-num {
      color: var(--accent);
    }

    .event.saturday .event-date .day-num {
      color: var(--saturday-num);
    }

    .event.sunday .event-date .day-num {
      color: var(--sunday-num);
    }

    /* 오늘이면서 토/일요일인 경우 — 오늘 색이 우선 */
    .event.today.saturday .event-date .day-num,
    .event.today.sunday .event-date .day-num {
      color: var(--accent);
    }

    .event-time {
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .event-title {
      font-size: 13px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-location {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 6px;
      font-weight: 400;
    }

    .event-empty {
      padding: 10px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    .empty {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 24px;
      text-align: center;
    }

    .login-card h2 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .login-card p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>My Calendar</h1>
        <div class="month-label" id="monthLabel"></div>
      </div>
      <div id="auth-buttons">
        <button id="signoutBtn" class="secondary" style="display:none;">로그아웃</button>
      </div>
    </header>

    <div id="status" class="status" style="display:none;"></div>

    <div id="login-area" class="login-card">
      <h2>Google 캘린더에 로그인하세요</h2>
      <p>이번 달 일정을 불러옵니다.</p>
      <button id="signinBtn" disabled>준비 중...</button>
    </div>

    <div id="events-area" style="display:none;">
      <div class="month-toggle">
        <button id="btn-this-month" class="active">이번달</button>
        <button id="btn-next-month">다음달</button>
      </div>
      <div id="events-list"></div>
    </div>

    <div class="footer">
      Google Calendar API · GitHub Pages
    </div>
  </div>

  <script>
    // ===== 설정 =====
    const CLIENT_ID = '147776399744-59t4vlsuhb7fqgkshi5vc2m00t6g5m2g.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';
    const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';

    // ===== 상태 =====
    let tokenClient;
    let gapiInited = false;
    let gisInited = false;

    // ===== UI 헬퍼 =====
    function showStatus(msg, isError) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status' + (isError ? ' error' : '');
      el.style.display = 'block';
    }
    function hideStatus() {
      document.getElementById('status').style.display = 'none';
    }

    // ===== 초기화 =====
    function gapiLoaded() {
      gapi.load('client', initializeGapiClient);
    }
    async function initializeGapiClient() {
      await gapi.client.init({ discoveryDocs: [DISCOVERY_DOC] });
      gapiInited = true;
      maybeEnableButtons();
    }
    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: '', // 동적으로 할당
      });
      gisInited = true;
      maybeEnableButtons();
    }
    function maybeEnableButtons() {
      if (gapiInited && gisInited) {
        const btn = document.getElementById('signinBtn');
        btn.disabled = false;
        btn.textContent = 'Google로 로그인';
      }
    }

    // ===== 로그인 / 로그아웃 =====
    document.getElementById('signinBtn').addEventListener('click', () => {
      tokenClient.callback = async (resp) => {
        if (resp.error !== undefined) {
          showStatus('로그인 실패: ' + resp.error, true);
          return;
        }
        document.getElementById('login-area').style.display = 'none';
        document.getElementById('events-area').style.display = 'block';
        document.getElementById('signoutBtn').style.display = 'inline-block';
        await loadEvents();
      };
      if (gapi.client.getToken() === null) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        tokenClient.requestAccessToken({ prompt: '' });
      }
    });

    document.getElementById('signoutBtn').addEventListener('click', () => {
      const token = gapi.client.getToken();
      if (token !== null) {
        google.accounts.oauth2.revoke(token.access_token, () => {});
        gapi.client.setToken('');
      }
      document.getElementById('login-area').style.display = 'block';
      document.getElementById('events-area').style.display = 'none';
      document.getElementById('signoutBtn').style.display = 'none';
      document.getElementById('events-list').innerHTML = '';
      // 버튼 상태 초기화
      currentMonthOffset = 0;
      document.getElementById('btn-this-month').classList.add('active');
      document.getElementById('btn-next-month').classList.remove('active');
      hideStatus();
    });

    // ===== 일정 로드 =====
    let currentMonthOffset = 0; // 0=이번달, 1=다음달

    document.getElementById('btn-this-month').addEventListener('click', () => {
      setActiveMonth(0);
    });
    document.getElementById('btn-next-month').addEventListener('click', () => {
      setActiveMonth(1);
    });

    function setActiveMonth(offset) {
      currentMonthOffset = offset;
      document.getElementById('btn-this-month').classList.toggle('active', offset === 0);
      document.getElementById('btn-next-month').classList.toggle('active', offset === 1);
      loadEvents();
    }

    async function loadEvents() {
      hideStatus();
      const now = new Date();
      const baseYear = now.getFullYear();
      const baseMonth = now.getMonth() + currentMonthOffset; // 0-indexed, offset 적용

      // 정규화된 연/월 (Date가 자동 처리: 12월+1 = 다음해 1월)
      const targetDate = new Date(baseYear, baseMonth, 1);
      const year = targetDate.getFullYear();
      const month = targetDate.getMonth();

      // 해당 월의 모든 주를 다 표시하므로, 조회 범위를 첫째 주의 월요일 ~ 마지막 주의 다음 월요일까지로 확장
      const allWeeks = getAllWeeksInMonth(year, month);
      const timeMin = allWeeks[0].toISOString();
      const lastWeekEnd = new Date(allWeeks[allWeeks.length - 1]);
      lastWeekEnd.setDate(lastWeekEnd.getDate() + 7);
      const timeMax = lastWeekEnd.toISOString();

      // 헤더에 월 표시
      document.getElementById('monthLabel').textContent =
        year + '년 ' + (month + 1) + '월';

      let events;
      try {
        const response = await gapi.client.calendar.events.list({
          calendarId: 'primary',
          timeMin: timeMin,
          timeMax: timeMax,
          showDeleted: false,
          singleEvents: true,
          orderBy: 'startTime',
          maxResults: 250,
        });
        events = response.result.items || [];
      } catch (err) {
        showStatus('일정을 불러오지 못했습니다: ' + (err.message || err.result?.error?.message || '알 수 없는 오류'), true);
        return;
      }

      renderEvents(events, year, month);
    }

    // ===== 주별 그룹화 헬퍼 =====
    function getWeekStart(date) {
      // 월요일을 주의 시작으로
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const day = d.getDay(); // 0=일, 1=월, ... 6=토
      const offset = (day === 0) ? -6 : -(day - 1);
      d.setDate(d.getDate() + offset);
      return d;
    }

    function getAllWeeksInMonth(year, month) {
      // 해당 월의 모든 주 시작일(월요일) 리스트
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0); // 해당 월 마지막 날
      const weeks = [];
      const cursor = getWeekStart(firstDay);
      while (cursor <= lastDay) {
        weeks.push(new Date(cursor));
        cursor.setDate(cursor.getDate() + 7);
      }
      return weeks;
    }

    function formatWeekHeader(weekStart) {
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekEnd.getDate() + 6);
      return (weekStart.getMonth() + 1) + '월 ' + weekStart.getDate() + '일'
           + ' — '
           + (weekEnd.getMonth() + 1) + '월 ' + weekEnd.getDate() + '일';
    }

    // ===== 단일 이벤트 row 생성 (컴팩트 3-컬럼) =====
    function buildEventRow(ev, todayKey, weekdayKo) {
      const start = ev.start.dateTime || ev.start.date;
      const isAllDay = !ev.start.dateTime;
      const startDate = new Date(start);

      const dayKey = startDate.getFullYear() + '-' + (startDate.getMonth()+1) + '-' + startDate.getDate();
      const isToday = (dayKey === todayKey);
      const dayOfWeek = startDate.getDay();

      const row = document.createElement('div');
      let rowClass = 'event';
      if (isToday) rowClass += ' today';
      if (dayOfWeek === 6) rowClass += ' saturday';
      if (dayOfWeek === 0) rowClass += ' sunday';
      row.className = rowClass;

      // 1) 날짜 박스
      const dateBox = document.createElement('div');
      dateBox.className = 'event-date';
      dateBox.innerHTML = '<span class="day-num">' + startDate.getDate() + '</span>' + weekdayKo[dayOfWeek];

      // 2) 시간 박스
      const timeBox = document.createElement('div');
      timeBox.className = 'event-time';
      if (isAllDay) {
        timeBox.textContent = '종일';
      } else {
        const sh = String(startDate.getHours()).padStart(2, '0');
        const sm = String(startDate.getMinutes()).padStart(2, '0');
        timeBox.textContent = sh + ':' + sm;
      }

      // 3) 제목 + (선택)장소
      const titleBox = document.createElement('div');
      titleBox.className = 'event-title';
      titleBox.textContent = ev.summary || '(제목 없음)';
      if (ev.location) {
        const locSpan = document.createElement('span');
        locSpan.className = 'event-location';
        locSpan.textContent = ' 📍 ' + ev.location;
        titleBox.appendChild(locSpan);
      }

      row.appendChild(dateBox);
      row.appendChild(timeBox);
      row.appendChild(titleBox);
      return row;
    }

    // ===== 렌더링 (해당 월의 모든 주를 섹션으로) =====
    function renderEvents(events, year, month) {
      const listEl = document.getElementById('events-list');
      listEl.innerHTML = '';

      const today = new Date();
      const todayKey = today.getFullYear() + '-' + (today.getMonth()+1) + '-' + today.getDate();
      const weekdayKo = ['일', '월', '화', '수', '목', '금', '토'];

      // 1) 이벤트들을 주별로 그룹화 (월요일 시작)
      const groups = new Map();
      events.forEach((ev) => {
        const start = ev.start.dateTime || ev.start.date;
        const startDate = new Date(start);
        const ws = getWeekStart(startDate);
        const key = ws.getTime();
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(ev);
      });

      // 2) 해당 월의 모든 주 (빈 주 포함) 순회
      const allWeeks = getAllWeeksInMonth(year, month);

      allWeeks.forEach((weekStart) => {
        const section = document.createElement('div');
        section.className = 'week-section';

        const header = document.createElement('div');
        header.className = 'week-header';
        header.textContent = formatWeekHeader(weekStart);
        section.appendChild(header);

        const eventsBox = document.createElement('div');
        eventsBox.className = 'week-events';

        const weekEvents = groups.get(weekStart.getTime()) || [];
        if (weekEvents.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'event-empty';
          empty.textContent = '—';
          eventsBox.appendChild(empty);
        } else {
          weekEvents.forEach((ev) => {
            eventsBox.appendChild(buildEventRow(ev, todayKey, weekdayKo));
          });
        }

        section.appendChild(eventsBox);
        listEl.appendChild(section);
      });
    }

    // ===== 라이브러리 로드 후 시작 =====
    window.addEventListener('load', () => {
      const checkLibs = setInterval(() => {
        if (typeof gapi !== 'undefined' && typeof google !== 'undefined' && google.accounts) {
          clearInterval(checkLibs);
          gapiLoaded();
          gisLoaded();
        }
      }, 100);
    });
  </script>
</body>
</html>
